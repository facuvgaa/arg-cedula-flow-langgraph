
name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


jobs:
  test-python:
    name: backend Test (fastApi & Langgraph)
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: set up python 
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        working-directory: prueba
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 
        
      - name: run unit test 
        working-directory: prueba
        run: |
          pytest tests/unit/
  
  build-frontend:
    name: Front build & typecheck (react + vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: set up node.js 
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install dependencies
        working-directory: frontend 
        run: npm install

      - name: build & typeScrip check 
        working-directory: frontend
        run: npm run build
      