
name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


jobs:
  test-python:
    name: backend Test (fastApi & Langgraph)
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: set up python 
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        working-directory: prueba
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 
        
      - name: run unit test 
        working-directory: prueba
        run: |
          pytest tests/unit/
  
  build-frontend:
    name: Front build & typecheck (react + vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: set up node.js 
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install dependencies
        working-directory: frontend 
        run: npm install

      - name: build & typeScrip check 
        working-directory: frontend
        run: npm run build
  
  build-and-push-docker:
    name: build & push docker images to ghcr
    runs-on: ubuntu-latest
    needs: [test-python, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
        contents: read
        packages: write
    steps:
      - name: Checkout repository 
        uses: actions/checkout@v4
      
      - name: log in to github container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - name: set up docket buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./prueba
          file: ./prueba/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
      
      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

